<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- CSS Animations -->
    <style>
      .orb-pulse {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      .bar-bounce1 {
        animation: barGrow1 3s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .bar-bounce2 {
        animation: barGrow2 3.5s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .bar-bounce3 {
        animation: barGrow3 4s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .bar-bounce4 {
        animation: barGrow4 3.2s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .star-twinkle {
        animation: twinkle 2.5s ease-in-out infinite alternate;
      }
      .indicator-ping {
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: center;
      }

      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.7; }
        100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes barGrow1 {
        0% { transform: scaleY(0.75); }
        100% { transform: scaleY(1.05); }
      }
      @keyframes barGrow2 {
        0% { transform: scaleY(0.8); }
        100% { transform: scaleY(1.1); }
      }
      @keyframes barGrow3 {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.15); }
      }
      @keyframes barGrow4 {
        0% { transform: scaleY(0.85); }
        100% { transform: scaleY(1.12); }
      }
      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes ping {
        0% { transform: scale(0.9); opacity: 0.8; }
        70%, 100% { transform: scale(2.2); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="100" r="160" fill="#38bdf8" filter="url(#softGlow)" class="orb-pulse" />
  <circle cx="1000" cy="300" r="180" fill="#8b5cf6" filter="url(#softGlow)" class="orb-pulse" style="animation-delay: -3s;" />

  <!-- Subtle Modern Tech Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.18">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Left Content Area -->
  <!-- Top Category Tag -->
  <g transform="translate(80, 72)">
    <rect width="265" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <circle cx="20" cy="16" r="4" fill="#34d399" />
    <circle cx="20" cy="16" r="8" fill="#34d399" opacity="0.4" class="indicator-ping" />
    <text x="36" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CONTINUOUS PERFORMANCE &amp; OKRS</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="165" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Awesome Performance Management
  </text>

  <!-- Subtitle -->
  <text x="80" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Curated Hub of Category-Leading SaaS &amp; Open-Source Platforms
  </text>

  <!-- Feature Badges on Left -->
  <g transform="translate(80, 260)">
    <!-- Badge 1: 360 Reviews -->
    <g transform="translate(0, 0)">
      <rect width="135" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 OKRs &amp; Goals</text>
    </g>
    <!-- Badge 2: Continuous Feedback -->
    <g transform="translate(150, 0)">
      <rect width="145" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔄 360° Reviews</text>
    </g>
    <!-- Badge 3: People Enablement -->
    <g transform="translate(310, 0)">
      <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💬 Continuous 1:1s</text>
    </g>
    <!-- Badge 4: Analytics -->
    <g transform="translate(490, 0)">
      <rect width="155" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 Talent Analytics</text>
    </g>
  </g>

  <!-- Right Visual Widget: Modern Performance Analytics Dashboard Card -->
  <g transform="translate(850, 60)">
    <!-- Container Card -->
    <rect width="270" height="270" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#glow)" />
    
    <!-- Card Header -->
    <text x="24" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Team Execution &amp; Health</text>
    <circle cx="240" cy="34" r="5" fill="#34d399" />
    <circle cx="240" cy="34" r="9" fill="#34d399" opacity="0.3" class="indicator-ping" />

    <!-- Metric pill -->
    <rect x="24" y="55" width="90" height="24" rx="12" fill="#064e3b" />
    <text x="34" y="71" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">▲ +34% OKR Rate</text>

    <!-- Animated Chart SVG Elements -->
    <!-- Grid line inside card -->
    <line x1="24" y1="140" x2="246" y2="140" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="24" y1="190" x2="246" y2="190" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="24" y1="240" x2="246" y2="240" stroke="#374151" stroke-width="1.5" />

    <!-- Animated Bars -->
    <!-- Bar 1 -->
    <g transform="translate(42, 240)">
      <rect x="0" y="-70" width="28" height="70" rx="6" fill="url(#barGrad1)" class="bar-bounce1" />
      <text x="14" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Q1</text>
    </g>

    <!-- Bar 2 -->
    <g transform="translate(94, 240)">
      <rect x="0" y="-105" width="28" height="105" rx="6" fill="url(#barGrad2)" class="bar-bounce2" />
      <text x="14" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Q2</text>
    </g>

    <!-- Bar 3 -->
    <g transform="translate(146, 240)">
      <rect x="0" y="-135" width="28" height="135" rx="6" fill="url(#barGrad3)" class="bar-bounce3" />
      <text x="14" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Q3</text>
    </g>

    <!-- Bar 4 -->
    <g transform="translate(198, 240)">
      <rect x="0" y="-160" width="28" height="160" rx="6" fill="url(#barGrad4)" class="bar-bounce4" />
      <text x="14" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Q4</text>
    </g>

    <!-- Dynamic Trend Curved Line -->
    <path d="M 56 165 Q 108 125, 160 95 T 212 70" fill="none" stroke="#38bdf8" stroke-width="2.5" class="dash-flow" />
    <circle cx="212" cy="70" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Sparkle Icons -->
  <g transform="translate(770, 85)" class="star-twinkle">
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#38bdf8" />
  </g>
  <g transform="translate(1140, 180)" class="star-twinkle" style="animation-delay: -1.2s;">
    <path d="M 0,-6 L 1.5,-1.5 L 6,0 L 1.5,1.5 L 0,6 L -1.5,1.5 L -6,0 L -1.5,-1.5 Z" fill="#c084fc" />
  </g>
  <g transform="translate(740, 270)" class="star-twinkle" style="animation-delay: -2s;">
    <path d="M 0,-5 L 1.2,-1.2 L 5,0 L 1.2,1.2 L 0,5 L -1.2,1.2 L -5,0 L -1.2,-1.2 Z" fill="#34d399" />
  </g>
</svg>
